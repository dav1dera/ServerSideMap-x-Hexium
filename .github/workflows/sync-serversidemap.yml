name: Sync ServerSideMap

on:
  schedule:
    - cron: "47 */6 * * *"
  workflow_dispatch:

concurrency:
  group: serversidemap-maintenance
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Detect upstream ServerSideMap state
        id: detect
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail

          BUILD_SCRIPT="scripts/build-serversidemap-1.0.sh"
          UPSTREAM_REPO="https://github.com/Mydayyy/Valheim-ServerSideMap.git"
          CURRENT_COMMIT="$(sed -n 's/^SSM_COMMIT="\([0-9a-f]\+\)"/\1/p' "$BUILD_SCRIPT")"
          CURRENT_VERSION="$(sed -n 's/^SSM_VERSION="\([^"]\+\)"/\1/p' "$BUILD_SCRIPT")"
          CURRENT_PACKAGE_VERSION="$(sed -n 's/^SSM_PACKAGE_VERSION="\([^"]\+\)"/\1/p' "$BUILD_SCRIPT")"
          CURRENT_REVISION="$(sed -n 's/^SSM_PACKAGE_REVISION="\([0-9]\+\)"/\1/p' "$BUILD_SCRIPT")"
          UPSTREAM_COMMIT="$(git ls-remote "$UPSTREAM_REPO" refs/heads/master | awk '{print $1}')"

          test -n "$CURRENT_COMMIT"
          test -n "$CURRENT_VERSION"
          test -n "$CURRENT_PACKAGE_VERSION"
          test -n "$CURRENT_REVISION"
          test -n "$UPSTREAM_COMMIT"

          TMP="${RUNNER_TEMP}/serversidemap-upstream"
          rm -rf "$TMP"
          git clone --quiet "$UPSTREAM_REPO" "$TMP"
          git -C "$TMP" checkout --quiet "$UPSTREAM_COMMIT"

          UPSTREAM_VERSION="$(python3 - "$TMP/ServerSideMap/ServerSideMap.cs" <<'PY'
          import re
          import sys
          from pathlib import Path

          text = Path(sys.argv[1]).read_text(encoding='utf-8-sig')
          match = re.search(
              r'BepInPlugin\(\s*"eu\.mydayyy\.plugins\.serversidemap"\s*,\s*"ServerSideMap"\s*,\s*"([^"]+)"\s*\)',
              text,
          )
          if not match:
              raise SystemExit('Could not determine ServerSideMap BepInPlugin version')
          version = match.group(1)
          parts = version.split('.')
          if len(parts) > 3 and all(part == '0' for part in parts[3:]):
              version = '.'.join(parts[:3])
          if not re.fullmatch(r'\d+\.\d+\.\d+(?:-(?:alpha|beta|rc)\.\d+)?', version):
              raise SystemExit(f'Unsupported Hexium package version format: {version}')
          print(version)
          PY
          )"

          changed=false
          if [[ "$UPSTREAM_COMMIT" != "$CURRENT_COMMIT" ]]; then
            changed=true
          fi

          should_build=false
          if [[ "$changed" == true || "$EVENT_NAME" == "workflow_dispatch" ]]; then
            should_build=true
          fi

          echo "current_commit=$CURRENT_COMMIT" >> "$GITHUB_OUTPUT"
          echo "current_version=$CURRENT_VERSION" >> "$GITHUB_OUTPUT"
          echo "current_package_version=$CURRENT_PACKAGE_VERSION" >> "$GITHUB_OUTPUT"
          echo "current_revision=$CURRENT_REVISION" >> "$GITHUB_OUTPUT"
          echo "upstream_commit=$UPSTREAM_COMMIT" >> "$GITHUB_OUTPUT"
          echo "upstream_version=$UPSTREAM_VERSION" >> "$GITHUB_OUTPUT"
          echo "changed=$changed" >> "$GITHUB_OUTPUT"
          echo "should_build=$should_build" >> "$GITHUB_OUTPUT"

          echo "Current upstream: $CURRENT_VERSION $CURRENT_COMMIT"
          echo "Current Hexium:   $CURRENT_PACKAGE_VERSION (revision $CURRENT_REVISION)"
          echo "Latest upstream:  $UPSTREAM_VERSION $UPSTREAM_COMMIT"
          echo "Changed:          $changed"

      - name: Update candidate pin and Hexium version
        if: steps.detect.outputs.changed == 'true'
        shell: bash
        env:
          NEW_VERSION: ${{ steps.detect.outputs.upstream_version }}
          NEW_COMMIT: ${{ steps.detect.outputs.upstream_commit }}
        run: |
          python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          path = Path('scripts/build-serversidemap-1.0.sh')
          text = path.read_text(encoding='utf-8')

          def read(pattern: str, label: str) -> str:
              match = re.search(pattern, text, re.MULTILINE)
              if not match:
                  raise SystemExit(f'Could not read {label}')
              return match.group(1)

          old_upstream_version = read(r'^SSM_VERSION="([^"]+)"$', 'SSM_VERSION')
          old_revision = int(read(r'^SSM_PACKAGE_REVISION="(\d+)"$', 'SSM_PACKAGE_REVISION'))
          new_upstream_version = os.environ['NEW_VERSION']
          new_commit = os.environ['NEW_COMMIT']

          if new_upstream_version == old_upstream_version:
              revision = old_revision + 1
          else:
              revision = 0

          if revision > 999:
              raise SystemExit('Too many same-upstream rebuilds; revision exceeded 999')

          version_match = re.fullmatch(
              r'(\d+)\.(\d+)\.(\d+)(?:-(alpha|beta|rc)\.(\d+))?',
              new_upstream_version,
          )
          if not version_match:
              raise SystemExit(f'Unsupported upstream version: {new_upstream_version}')

          major, minor, patch, prerelease, prerelease_no = version_match.groups()
          if prerelease:
              encoded_prerelease = int(prerelease_no) * 1000 + revision
              package_version = f'{major}.{minor}.{patch}-{prerelease}.{encoded_prerelease}'
          elif revision == 0 and int(patch) == 0:
              package_version = f'{major}.{minor}.0'
          else:
              encoded_patch = int(patch) * 1000 + revision
              package_version = f'{major}.{minor}.{encoded_patch}'

          replacements = [
              (r'^SSM_COMMIT="[0-9a-f]+"$', f'SSM_COMMIT="{new_commit}"'),
              (r'^SSM_VERSION="[^"]+"$', f'SSM_VERSION="{new_upstream_version}"'),
              (r'^SSM_PACKAGE_VERSION="[^"]+"$', f'SSM_PACKAGE_VERSION="{package_version}"'),
              (r'^SSM_PACKAGE_REVISION="\d+"$', f'SSM_PACKAGE_REVISION="{revision}"'),
          ]

          for pattern, replacement in replacements:
              text, count = re.subn(pattern, replacement, text, count=1, flags=re.MULTILINE)
              if count != 1:
                  raise SystemExit(f'Could not update pin: {pattern}')

          path.write_text(text, encoding='utf-8')
          print(f'Upstream: {new_upstream_version} {new_commit}')
          print(f'Hexium package: {package_version} (revision {revision})')
          PY

      - name: Build ServerSideMap against current Valheim
        if: steps.detect.outputs.should_build == 'true'
        shell: bash
        run: bash scripts/build-serversidemap-1.0.sh

      - name: Package for Hexium
        if: steps.detect.outputs.should_build == 'true'
        id: package
        shell: bash
        run: |
          python3 scripts/package-serversidemap-hexium.py
          VERSION="$(sed -n 's/^SSM_PACKAGE_VERSION="\([^"]\+\)"/\1/p' scripts/build-serversidemap-1.0.sh)"
          test -n "$VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          test -s "dist/hexium/ServerSideMap_Valheim1Fix-${VERSION}-hexium.zip"
          sha256sum dist/build/ServerSideMap.dll

      - name: Upload package artifact
        if: steps.detect.outputs.should_build == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ServerSideMap_Valheim1Fix-${{ steps.package.outputs.version }}-hexium
          path: dist/hexium/ServerSideMap_Valheim1Fix-${{ steps.package.outputs.version }}-hexium.zip
          if-no-files-found: error
          retention-days: 30

      - name: Publish to Hexium
        if: steps.detect.outputs.should_build == 'true'
        shell: bash
        env:
          HEXIUM_TOKEN: ${{ secrets.HEXIUM_TOKEN }}
          HEXIUM_TEAM: Sgorbi
          HEXIUM_PACKAGE: ServerSideMap_Valheim1Fix
          HEXIUM_COMMUNITY: valheim
          HEXIUM_CATEGORIES: Valheim 1.0
        run: |
          if [[ -z "$HEXIUM_TOKEN" ]]; then
            echo "HEXIUM_TOKEN is not configured; skipping Hexium publish."
            exit 0
          fi
          python3 scripts/publish-serversidemap-hexium.py

      - name: Commit tested upstream pin
        if: steps.detect.outputs.changed == 'true'
        shell: bash
        env:
          NEW_VERSION: ${{ steps.detect.outputs.upstream_version }}
          NEW_COMMIT: ${{ steps.detect.outputs.upstream_commit }}
        run: |
          set -euo pipefail
          PACKAGE_VERSION="$(sed -n 's/^SSM_PACKAGE_VERSION="\([^"]\+\)"/\1/p' scripts/build-serversidemap-1.0.sh)"
          REVISION="$(sed -n 's/^SSM_PACKAGE_REVISION="\([0-9]\+\)"/\1/p' scripts/build-serversidemap-1.0.sh)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/build-serversidemap-1.0.sh
          git diff --cached --quiet && exit 0
          git commit -m "chore(serversidemap): track Mydayyy ${NEW_VERSION} as ${PACKAGE_VERSION}"
          git push origin HEAD:main
          echo "Pinned tested ServerSideMap ${NEW_VERSION} at ${NEW_COMMIT}"
          echo "Hexium package ${PACKAGE_VERSION}, same-upstream revision ${REVISION}"
